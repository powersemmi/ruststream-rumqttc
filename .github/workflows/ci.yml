name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, msrv]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The MSRV leg follows `rust-version` in Cargo.toml, so an MSRV bump is a one-line change.
      - name: Resolve toolchain
        id: toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          if [ "$TOOLCHAIN" = "msrv" ]; then
            TOOLCHAIN="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)"
            test -n "$TOOLCHAIN"
          fi
          echo "toolchain=$TOOLCHAIN" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --workspace --all-features

  broker-integration:
    name: Broker integration (mosquitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start mosquitto
        run: |
          docker run -d --name mosquitto \
            -p 127.0.0.1:1883:1883 \
            eclipse-mosquitto:2

      - name: Wait for mosquitto
        timeout-minutes: 1
        run: |
          timeout 30 bash -c 'until docker exec mosquitto mosquitto_sub -h 127.0.0.1 -p 1883 -t healthcheck -E -i probe -W 2; do sleep 1; done'
          docker logs mosquitto | tail -3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against mosquitto
        env:
          MQTT_TEST_URL: mqtt://127.0.0.1:1883
        run: >-
          cargo test -p ruststream-rumqttc --all-features
          --test integration_mqtt
          --test conformance_mqtt
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker rm -f mosquitto

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
