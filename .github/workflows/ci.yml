name: CI

on:
  push:
    branches: [main]
  # No base filter: a pull request stacked on another one has a branch for its base, and a filter
  # naming `main` leaves it with no checks at all - which reads as a conflicting branch rather
  # than as a workflow that declined to run.
  #
  # A draft runs nothing: every job below declines while `draft` is true, so work can be opened
  # for reading and the maintainer decides when CI spends its time on it. `ready_for_review` is
  # what brings the workflow back at that moment, and it has to be listed because naming any type
  # at all replaces the default set.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build and test (${{ matrix.toolchain }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too. The floor is spelled out
        # rather than read from the manifest so it can select the toolchain directly; keep it in
        # step with `rust-version` in Cargo.toml.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      # The benchmark package is left out of every all-features leg on purpose: it is built with
      # the feature set a service ships, and the framework's harness feature is a compile error
      # in it. Its own leg follows each of them, so it stays linted and stays compiled.
      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --workspace --exclude ruststream-rumqttc-bench --all-targets --all-features -- -D warnings

      - name: cargo clippy (benchmarks)
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked -p ruststream-rumqttc-bench --all-targets -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: |
          cargo clippy --locked --workspace --exclude ruststream-rumqttc-bench --all-targets --all-features -- -D warnings
          cargo clippy --locked -p ruststream-rumqttc-bench --all-targets -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --locked --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --locked --workspace --exclude ruststream-rumqttc-bench --all-targets --all-features

      - name: cargo check (benchmarks)
        run: cargo check --locked -p ruststream-rumqttc-bench --all-targets

      # The handler-stub suite only: the live tests skip themselves without MQTT_TEST_URL, and
      # the broker-backed job below runs them against a real mosquitto.
      # --no-fail-fast: a failing target must not hide failures in the targets behind it;
      # the log then lists every red test, not just the first binary's.
      - name: cargo test (handler-stub only, no live broker)
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  features:
    name: Each feature alone
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.87.11
        with:
          tool: cargo-hack

      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      # It also rewrites the manifests in place, which is why this is the one job without
      # --locked.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with
      # `rust-version` in the workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # A too-loose bound in a third-party manifest reached through this crate's own
      # dependencies; drop it when the crate that declares it moves its floor.
      #
      # tracing-attributes 0.1.13 (reached through `tracing`) declares `syn = "1.0"` but calls
      # `LitInt::base10_parse`, added in 1.0.4.
      - name: Pin dependencies whose declared bounds are too loose
        run: cargo update -p syn@1.0.0 --precise 1.0.4

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --exclude ruststream-rumqttc-bench --all-targets --all-features
          cargo check --locked -p ruststream-rumqttc-bench --all-targets
          cargo test --locked --workspace --all-features --no-fail-fast

  broker-integration:
    name: Broker integration (mosquitto)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same stand `just test-brokers` starts, so the authenticated listener and the
      # anonymous one are defined once and this job cannot drift from a developer's run.
      - name: Start mosquitto
        timeout-minutes: 2
        run: |
          scripts/stand_tls_certs.sh
          docker compose -f docker-compose.test.yml up -d --wait
          docker compose -f docker-compose.test.yml logs | tail -3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integration + conformance against mosquitto
        env:
          MQTT_TEST_URL: mqtt://127.0.0.1:1883
          MQTT_TEST_AUTH_URL: mqtt://127.0.0.1:1884
          MQTT_TEST_TLS_URL: mqtts://127.0.0.1:8883
          MQTT_TEST_TLS_DIR: ${{ github.workspace }}/.stand-tls
          # The gated tests skip themselves without the URL, so a renamed variable or a dropped
          # env block would leave this job green having asserted nothing. With this set, a
          # missing URL fails the suite instead of skipping it.
          RUSTSTREAM_REQUIRE_LIVE: "1"
        run: >-
          cargo test --locked -p ruststream-rumqttc --all-features
          --test integration_mqtt
          --test conformance_mqtt
          --test handlers_live_mqtt
          -- --test-threads=1

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  security:
    name: Security scans
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.11
        with:
          tool: cargo-deny

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        run: cargo deny check

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: codespell
        run: uvx codespell

      - name: zizmor
        run: uvx zizmor .github/workflows
