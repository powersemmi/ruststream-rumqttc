name: Pull request labels

# The labeling rules live in the core repository and are shared by every repository of the family.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  # Creating the label of a release version is an issues permission.
  issues: write
  pull-requests: write

jobs:
  label:
    uses: powersemmi/ruststream/.github/workflows/pr-labels.yml@main
