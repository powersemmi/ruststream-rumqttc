[workspace]
resolver = "3"
members = ["crates/ruststream-rumqttc"]

[workspace.package]
version = "0.7.0"
edition = "2024"
# The floor tracks the core line: ruststream 0.7 requires 1.88, so a lower one cannot resolve it.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream-rumqttc"
authors = ["RustStream contributors"]

[workspace.dependencies]
ruststream-rumqttc = { path = "crates/ruststream-rumqttc" }
# The lower bound names the pre-release so cargo admits it: a range that mentions no pre-release
# excludes every pre-release, so `>=0.7.0` would skip 0.7.0-rc.1. The final 0.7.0 satisfies this
# range too, so the requirement does not need revisiting once the core line settles.
ruststream = { version = ">=0.7.0-rc.1, <0.8.0", default-features = false }

rumqttc = "0.25"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
