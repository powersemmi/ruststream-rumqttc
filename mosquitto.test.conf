# The stand the live suite runs against. Two listeners, because authentication is a broker
# capability like any other and the only place it can be observed is a broker that requires it.

# Each listener answers for its own authentication, which is what lets the two stand side by side.
per_listener_settings true

# Anonymous, and what MQTT_TEST_URL points at: every test that is not about credentials.
listener 1883
allow_anonymous true

# Requires a user name and a password, which is what MQTT_TEST_AUTH_URL points at. The file is
# written when the container starts (see the compose command), because mosquitto 2 refuses a
# password file that is not hashed.
listener 1884
allow_anonymous false
password_file /tmp/passwd
