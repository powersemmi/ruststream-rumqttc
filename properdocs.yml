site_name: ruststream-rumqttc
site_description: The MQTT 5 broker for RustStream - topic filters with QoS and shared groups, retained publishes, and an in-process test broker.
site_url: https://powersemmi.github.io/ruststream-rumqttc/
repo_url: https://github.com/powersemmi/ruststream-rumqttc
repo_name: powersemmi/ruststream-rumqttc
edit_uri: edit/main/docs/
copyright: Apache-2.0

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # Renders :material-xxx: / :fontawesome-xxx: shortcodes (used on the home page grid) as inline
  # SVG icons. Without it those shortcodes show up as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.tabbed:
      alternate_style: true

hooks:
  - docs/hooks/snippet_titles.py
  - docs/hooks/i18n_banner.py

plugins:
  - search
  # The MQTT guide moved into the crate's rustdoc, where the items it describes already live.
  # Every URL it published keeps working and lands on the overview section that took the topic
  # over. External targets are what mkdocs-redirects 1.2.3 added; an older one rewrites them as
  # relative paths and produces a broken link.
  - redirects:
      redirect_maps:
        mqtt.md: https://docs.rs/ruststream-rumqttc/latest/ruststream_rumqttc/index.html
        ru/mqtt.md: https://docs.rs/ruststream-rumqttc/latest/ruststream_rumqttc/index.html
        zh/mqtt.md: https://docs.rs/ruststream-rumqttc/latest/ruststream_rumqttc/index.html
  # Versioned docs are published with `mike` (see the Docs workflow and the version switcher).
  # Each translation is a tree of its own under `docs/<locale>/`, mirroring the English paths.
  # English stays at the docs root: a file outside a locale folder is the default language.
  #
  # English is normative; a page with no translation yet falls back to the English text inside
  # the localized site rather than disappearing from it, which is what lets translations land
  # page by page. The entry page is translated into both locales, so the fallback carries nothing
  # today; it is what keeps a new English page visible in `ru` and `zh` before it is translated.
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ru
          name: Russian
          build: true
          nav_translations:
            Home: Главная
            Benchmarks: Бенчмарки
            RustStream docs: Документация RustStream
            API reference: Справочник API
        - locale: zh
          name: Chinese
          build: true
          nav_translations:
            Home: 首页
            Benchmarks: 基准测试
            RustStream docs: RustStream 文档
            API reference: API 参考

# The benchmarks page builds its tables in the browser from the document `just bench` publishes,
# so a re-measurement rewrites that document and no page. The script is a no-op everywhere else.
extra_javascript:
  - assets/benchmarks.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/powersemmi/ruststream-rumqttc

nav:
  - Home: index.md
  - Benchmarks: benchmarks.md
  - RustStream docs: https://powersemmi.github.io/ruststream/
  - API reference: https://docs.rs/ruststream-rumqttc
